name: Live All-in-One Quickstart

on:
  schedule:
    - cron: '17 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-quickstart:
    if: github.repository == 'ob-labs/ai-vision-skills'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Prepare the Docker image store required by the released installer
        run: |
          # The installer compares Docker's image ID to the published config digest.
          if [[ "$(docker info --format '{{json .DriverStatus}}')" == *io.containerd.snapshotter.v1* ]]; then
            config=$(mktemp)
            trap 'rm -f "$config"' EXIT
            if sudo test -f /etc/docker/daemon.json; then
              sudo cat /etc/docker/daemon.json
            else
              printf '{}\n'
            fi | python3 -c '
          import json
          import sys

          config = json.load(sys.stdin)
          config.setdefault("features", {})["containerd-snapshotter"] = False
          print(json.dumps(config))
          ' > "$config"
            sudo install -D -m 0600 "$config" /etc/docker/daemon.json
            sudo systemctl restart docker
          fi
          driver_status=$(docker info --format '{{json .DriverStatus}}')
          if [[ "$driver_status" == *io.containerd.snapshotter.v1* ]]; then
            echo 'The published All-in-One installer requires the classic Docker image store.' >&2
            exit 1
          fi
      - name: Install pinned Chromium test tools
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/aiv-quickstart-chromium
        run: |
          browser_tools="$RUNNER_TEMP/aiv-quickstart-browser"
          npm install --prefix "$browser_tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.58.2
          "$browser_tools/node_modules/.bin/playwright" install --with-deps --only-shell chromium
      - name: Deploy the latest public Personal Edition and verify the browser example
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/aiv-quickstart-chromium
        run: |
          export NODE_PATH="$RUNNER_TEMP/aiv-quickstart-browser/node_modules"
          python3 -B scripts/check_live_quickstart.py
